<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

  .style-picker {
    display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 16px;
    background: #f5f5f5; border-bottom: 1px solid #ddd;
    position: sticky; top: 0; z-index: 100;
  }
  .style-btn {
    padding: 5px 12px; border-radius: 20px; border: 1.5px solid #ccc;
    font-size: 12px; cursor: pointer; background: #fff; transition: all 0.2s;
    font-family: inherit;
  }
  .style-btn.active { background: #222; color: #fff; border-color: #222; }

  #canvas { width: 100%; min-height: 700px; }

  /* ─── NEOMORPHISM ─── */
  .neo-root {
    background: #e0e5ec; min-height: 700px; padding: 28px 24px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .neo-nav {
    background: #e0e5ec; border-radius: 18px; padding: 14px 20px;
    box-shadow: 8px 8px 16px #b8bec7, -8px -8px 16px #ffffff;
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;
  }
  .neo-logo { display: flex; align-items: center; gap: 10px; }
  .neo-logo-icon {
    width: 38px; height: 38px; border-radius: 12px;
    background: #e0e5ec; box-shadow: 4px 4px 8px #b8bec7, -4px -4px 8px #ffffff;
    display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .neo-logo-text { font-size: 15px; font-weight: 600; color: #4a5568; letter-spacing: -0.3px; }
  .neo-nav-icons { display: flex; gap: 10px; }
  .neo-icon-btn {
    width: 36px; height: 36px; border-radius: 10px;
    background: #e0e5ec; box-shadow: 4px 4px 8px #b8bec7, -4px -4px 8px #ffffff;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; cursor: pointer; color: #637080; border: none;
  }

  .neo-style-tabs {
    display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
  }
  .neo-tab {
    padding: 7px 14px; border-radius: 10px; font-size: 12px; color: #6b7c93;
    background: #e0e5ec; box-shadow: 4px 4px 8px #b8bec7, -4px -4px 8px #ffffff;
    cursor: pointer; border: none; font-family: inherit;
  }
  .neo-tab.selected {
    box-shadow: inset 4px 4px 8px #b8bec7, inset -4px -4px 8px #ffffff;
    color: #3a7bd5;
  }

  .neo-main-card {
    background: #e0e5ec; border-radius: 24px;
    box-shadow: 12px 12px 24px #b8bec7, -12px -12px 24px #ffffff;
    padding: 36px 32px; text-align: center; margin-bottom: 20px;
  }
  .neo-icon-circle {
    width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 24px;
    background: #e0e5ec; box-shadow: 8px 8px 16px #b8bec7, -8px -8px 16px #ffffff;
    display: flex; align-items: center; justify-content: center; font-size: 42px;
  }
  .neo-404 { font-size: 80px; font-weight: 700; color: #4a5568; letter-spacing: -4px; line-height: 1; margin-bottom: 8px; }
  .neo-title { font-size: 22px; font-weight: 600; color: #4a5568; margin-bottom: 10px; }
  .neo-subtitle { font-size: 14px; color: #8a9bb0; line-height: 1.6; max-width: 380px; margin: 0 auto 28px; }

  .neo-btn-row { display: flex; gap: 12px; justify-content: center; margin-bottom: 28px; flex-wrap: wrap; }
  .neo-btn-primary {
    padding: 11px 24px; border-radius: 12px; border: none; cursor: pointer;
    background: #e0e5ec; box-shadow: 6px 6px 12px #b8bec7, -6px -6px 12px #ffffff;
    color: #3a7bd5; font-size: 13px; font-weight: 600; font-family: inherit;
    display: flex; align-items: center; gap: 6px;
  }
  .neo-btn-primary.pressed {
    box-shadow: inset 4px 4px 8px #b8bec7, inset -4px -4px 8px #ffffff;
  }
  .neo-search {
    background: #e0e5ec; border-radius: 14px; border: none;
    box-shadow: inset 6px 6px 12px #b8bec7, inset -6px -6px 12px #ffffff;
    padding: 13px 18px; width: 100%; max-width: 400px;
    font-size: 14px; color: #4a5568; font-family: inherit; outline: none;
  }
  .neo-search-wrap { display: flex; justify-content: center; }

  .neo-tile-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 20px;
  }
  .neo-tile {
    background: #e0e5ec; border-radius: 18px;
    box-shadow: 8px 8px 16px #b8bec7, -8px -8px 16px #ffffff;
    padding: 20px 14px; text-align: center; cursor: pointer;
  }
  .neo-tile-icon { font-size: 24px; margin-bottom: 8px; color: #3a7bd5; }
  .neo-tile-label { font-size: 12px; color: #6b7c93; font-weight: 500; }
  .neo-tile-sub { font-size: 11px; color: #a0aab8; margin-top: 3px; }

  .neo-progress-row { display: flex; gap: 12px; margin: 20px 0; }
  .neo-progress-card {
    flex: 1; background: #e0e5ec; border-radius: 16px;
    box-shadow: 6px 6px 12px #b8bec7, -6px -6px 12px #ffffff;
    padding: 14px 16px;
  }
  .neo-progress-label { font-size: 12px; color: #8a9bb0; margin-bottom: 6px; }
  .neo-progress-track {
    height: 8px; border-radius: 4px; width: 100%;
    background: #e0e5ec; box-shadow: inset 3px 3px 6px #b8bec7, inset -3px -3px 6px #ffffff;
    overflow: hidden;
  }
  .neo-progress-fill { height: 100%; border-radius: 4px; }
  .neo-progress-val { font-size: 13px; font-weight: 600; color: #4a5568; margin-top: 5px; }

  .neo-toggle-row { display: flex; gap: 4px; background: #e0e5ec; border-radius: 12px; box-shadow: inset 4px 4px 8px #b8bec7, inset -4px -4px 8px #ffffff; padding: 4px; }
  .neo-toggle-opt { flex: 1; padding: 7px; border-radius: 9px; text-align: center; font-size: 12px; cursor: pointer; color: #8a9bb0; border: none; background: transparent; font-family: inherit; }
  .neo-toggle-opt.on { background: #e0e5ec; box-shadow: 4px 4px 8px #b8bec7, -4px -4px 8px #ffffff; color: #3a7bd5; font-weight: 600; }

  .neo-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 16px; border-top: 1px solid rgba(0,0,0,0.06); margin-top: 20px; }
  .neo-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 10px; background: #e0e5ec; box-shadow: 3px 3px 6px #b8bec7, -3px -3px 6px #ffffff; font-size: 11px; color: #6b7c93; }

  /* ─── GLASSMORPHISM ─── */
  .glass-root {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
    min-height: 700px; padding: 28px 24px;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    position: relative; overflow: hidden;
  }
  .glass-orb1 {
    position: absolute; width: 320px; height: 320px; border-radius: 50%;
    background: radial-gradient(circle, rgba(100,108,255,0.35) 0%, transparent 70%);
    top: -60px; right: -60px; pointer-events: none;
  }
  .glass-orb2 {
    position: absolute; width: 240px; height: 240px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,100,130,0.25) 0%, transparent 70%);
    bottom: 80px; left: -40px; pointer-events: none;
  }
  .glass-orb3 {
    position: absolute; width: 180px; height: 180px; border-radius: 50%;
    background: radial-gradient(circle, rgba(100,220,255,0.2) 0%, transparent 70%);
    top: 50%; right: 10%; pointer-events: none;
  }
  .glass-nav {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px; padding: 14px 20px; backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;
    position: relative; z-index: 2;
  }
  .glass-logo-icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .glass-logo-text { font-size: 15px; font-weight: 600; color: #fff; }
  .glass-nav-right { display: flex; gap: 8px; align-items: center; }
  .glass-pill-btn {
    padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.85); font-size: 12px;
    cursor: pointer; font-family: inherit;
  }
  .glass-icon-btn {
    width: 34px; height: 34px; border-radius: 10px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center; font-size: 15px; color: #fff;
    cursor: pointer;
  }

  .glass-tags { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; position: relative; z-index: 2; }
  .glass-tag {
    padding: 5px 14px; border-radius: 20px; font-size: 12px;
    border: 1px solid rgba(255,255,255,0.18); color: rgba(255,255,255,0.75); cursor: pointer;
    background: rgba(255,255,255,0.06);
  }
  .glass-tag.active { background: rgba(255,255,255,0.18); color: #fff; }

  .glass-card {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 24px; padding: 36px; backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px); text-align: center; margin-bottom: 20px;
    position: relative; z-index: 2;
  }
  .glass-icon-wrap {
    width: 96px; height: 96px; border-radius: 50%; margin: 0 auto 20px;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center; font-size: 40px;
    position: relative;
  }
  .glass-icon-ring {
    position: absolute; inset: -8px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .glass-icon-ring2 {
    position: absolute; inset: -16px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .glass-404 { font-size: 88px; font-weight: 700; letter-spacing: -4px; line-height: 1; margin-bottom: 8px; background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.6) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .glass-title { font-size: 22px; font-weight: 600; color: rgba(255,255,255,0.95); margin-bottom: 10px; }
  .glass-sub { font-size: 14px; color: rgba(255,255,255,0.6); line-height: 1.6; max-width: 380px; margin: 0 auto 28px; }

  .glass-btn-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 28px; flex-wrap: wrap; }
  .glass-btn-primary {
    padding: 11px 24px; border-radius: 14px; cursor: pointer; font-size: 13px; font-weight: 600;
    background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.3);
    color: #fff; font-family: inherit; backdrop-filter: blur(10px);
    display: flex; align-items: center; gap: 6px;
  }
  .glass-btn-outline {
    padding: 11px 24px; border-radius: 14px; cursor: pointer; font-size: 13px;
    background: transparent; border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.8); font-family: inherit;
    display: flex; align-items: center; gap: 6px;
  }
  .glass-search-wrap {
    display: flex; align-items: center; gap: 10px; max-width: 420px; margin: 0 auto;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px; padding: 11px 16px;
  }
  .glass-search { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 14px; font-family: inherit; }
  .glass-search::placeholder { color: rgba(255,255,255,0.4); }

  .glass-tile-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 20px; position: relative; z-index: 2; }
  .glass-tile {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 18px; padding: 20px 12px; text-align: center;
    backdrop-filter: blur(12px); cursor: pointer;
  }
  .glass-tile-icon { font-size: 22px; margin-bottom: 8px; }
  .glass-tile-label { font-size: 12px; color: rgba(255,255,255,0.8); font-weight: 500; }
  .glass-tile-sub { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 3px; }

  .glass-stat-row { display: flex; gap: 10px; margin: 16px 0; position: relative; z-index: 2; }
  .glass-stat {
    flex: 1; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px; padding: 14px; backdrop-filter: blur(12px);
  }
  .glass-stat-num { font-size: 22px; font-weight: 700; color: #fff; }
  .glass-stat-label { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 3px; }

  /* ─── MINIMALISM ─── */
  .min-root { background: #fafaf9; min-height: 700px; padding: 28px 24px; font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; }
  .min-nav { display: flex; align-items: center; justify-content: space-between; padding-bottom: 20px; border-bottom: 1px solid #e8e5e0; margin-bottom: 24px; }
  .min-logo { font-size: 15px; font-weight: 500; color: #111; letter-spacing: -0.3px; }
  .min-nav-links { display: flex; gap: 24px; }
  .min-nav-link { font-size: 13px; color: #888; cursor: pointer; text-decoration: none; }
  .min-nav-link.active { color: #111; }
  .min-nav-right { display: flex; gap: 12px; align-items: center; }
  .min-icon { font-size: 18px; color: #666; cursor: pointer; }

  .min-breadcrumb { font-size: 12px; color: #999; margin-bottom: 60px; display: flex; gap: 8px; align-items: center; }
  .min-breadcrumb span { color: #ddd; }

  .min-main { text-align: center; padding: 0 20px; }
  .min-404-label { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #bbb; margin-bottom: 16px; }
  .min-404 { font-size: 96px; font-weight: 200; color: #111; letter-spacing: -6px; line-height: 1; margin-bottom: 8px; }
  .min-title { font-size: 20px; font-weight: 400; color: #333; margin-bottom: 10px; }
  .min-sub { font-size: 14px; color: #999; line-height: 1.7; max-width: 360px; margin: 0 auto 32px; }

  .min-btn-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 40px; flex-wrap: wrap; }
  .min-btn-primary { padding: 10px 22px; border: 1px solid #111; background: #111; color: #fff; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; font-family: inherit; }
  .min-btn-outline { padding: 10px 22px; border: 1px solid #ccc; background: transparent; color: #555; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; font-family: inherit; }

  .min-divider { border: none; border-top: 1px solid #e8e5e0; margin: 20px 0; }
  .min-link-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: #e8e5e0; border: 1px solid #e8e5e0; }
  .min-link-tile { background: #fafaf9; padding: 18px 14px; text-align: center; cursor: pointer; }
  .min-link-tile:hover { background: #f5f2ed; }
  .min-link-icon { font-size: 16px; color: #333; margin-bottom: 6px; }
  .min-link-label { font-size: 12px; color: #555; letter-spacing: 0.5px; text-transform: uppercase; }

  .min-search-row { display: flex; max-width: 400px; margin: 28px auto 0; border-bottom: 1px solid #333; }
  .min-search { flex: 1; border: none; background: transparent; outline: none; font-size: 14px; padding: 8px 0; color: #111; font-family: inherit; }
  .min-search::placeholder { color: #bbb; }
  .min-search-btn { border: none; background: transparent; cursor: pointer; font-size: 16px; color: #333; padding: 8px; }

  .min-footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #e8e5e0; display: flex; justify-content: space-between; align-items: center; }
  .min-footer-left { display: flex; gap: 16px; }
  .min-footer-link { font-size: 11px; color: #aaa; cursor: pointer; text-decoration: underline; }
  .min-footer-copy { font-size: 11px; color: #ccc; }

  /* ─── BRUTALISM ─── */
  .brut-root { background: #f2f0e4; min-height: 700px; padding: 0; font-family: 'Courier New', Courier, monospace; }
  .brut-nav { background: #000; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 6px solid #ff0; }
  .brut-logo { color: #ff0; font-size: 16px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
  .brut-nav-links { display: flex; gap: 20px; }
  .brut-nav-link { color: #fff; font-size: 12px; text-transform: uppercase; cursor: pointer; letter-spacing: 1px; }
  .brut-nav-right { display: flex; gap: 8px; }
  .brut-nav-btn { background: #ff0; border: none; padding: 6px 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; cursor: pointer; font-family: inherit; letter-spacing: 1px; }
  .brut-nav-btn.alt { background: #fff; }

  .brut-ticker { background: #ff0; padding: 6px 24px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; overflow: hidden; white-space: nowrap; border-bottom: 3px solid #000; }

  .brut-body { padding: 24px; }
  .brut-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; margin-bottom: 24px; }
  .brut-main-box { border: 5px solid #000; background: #fff; padding: 32px; box-shadow: 12px 12px 0 #000; }
  .brut-404 { font-size: 100px; font-weight: 900; color: #000; line-height: 1; letter-spacing: -4px; border-bottom: 5px solid #000; padding-bottom: 8px; margin-bottom: 12px; }
  .brut-title { font-size: 20px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #000; margin-bottom: 12px; }
  .brut-sub { font-size: 13px; color: #333; line-height: 1.6; margin-bottom: 20px; }
  .brut-highlight { background: #ff0; padding: 0 4px; }
  .brut-btn-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .brut-btn { border: 4px solid #000; background: #000; color: #fff; padding: 10px 20px; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; font-family: inherit; box-shadow: 6px 6px 0 #ff0; }
  .brut-btn.outline { background: #fff; color: #000; box-shadow: 6px 6px 0 #000; }
  .brut-btn.red { background: #f00; border-color: #f00; box-shadow: 6px 6px 0 #000; }

  .brut-sidebar { display: flex; flex-direction: column; gap: 16px; }
  .brut-side-box { border: 4px solid #000; background: #fff; padding: 16px; box-shadow: 6px 6px 0 #000; }
  .brut-side-title { font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; border-bottom: 3px solid #000; padding-bottom: 6px; margin-bottom: 10px; }
  .brut-side-item { font-size: 12px; padding: 6px 0; border-bottom: 1px dashed #ccc; cursor: pointer; }
  .brut-side-item:last-child { border: none; }

  .brut-bottom-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border: 4px solid #000; box-shadow: 8px 8px 0 #000; }
  .brut-bottom-cell { border-right: 4px solid #000; padding: 16px 12px; text-align: center; background: #fff; cursor: pointer; }
  .brut-bottom-cell:last-child { border-right: none; }
  .brut-bottom-cell:nth-child(odd) { background: #f2f0e4; }
  .brut-cell-num { font-size: 28px; font-weight: 900; color: #000; }
  .brut-cell-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #555; margin-top: 2px; }

  .brut-search-row { display: flex; margin: 24px 0 0; }
  .brut-search { flex: 1; border: 4px solid #000; border-right: none; background: #fff; padding: 10px 14px; font-size: 13px; font-family: inherit; outline: none; }
  .brut-search-btn { border: 4px solid #000; background: #ff0; padding: 10px 16px; font-size: 12px; font-weight: 900; text-transform: uppercase; cursor: pointer; font-family: inherit; }

  /* ─── MAXIMALISM ─── */
  .max-root { background: #fff; min-height: 700px; padding: 0; font-family: Georgia, 'Times New Roman', serif; overflow: hidden; }
  .max-hero { background: linear-gradient(135deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #54a0ff); padding: 22px 24px; position: relative; overflow: hidden; }
  .max-hero::before { content: ''; position: absolute; inset: 0; background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.08'%3E%3Ccircle cx='30' cy='30' r='20'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"); }
  .max-nav { display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1; }
  .max-logo-text { font-size: 20px; font-weight: 700; color: #fff; text-shadow: 2px 2px 0 rgba(0,0,0,0.2); }
  .max-nav-badges { display: flex; gap: 8px; }
  .max-badge { padding: 5px 12px; border: 2px solid rgba(255,255,255,0.8); color: #fff; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; font-family: inherit; background: rgba(255,255,255,0.15); }

  .max-body { padding: 24px; }
  .max-center { text-align: center; padding: 24px 0; }
  .max-sticker { display: inline-block; background: #ff6b6b; border: 4px solid #000; padding: 3px 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: #fff; transform: rotate(-2deg); margin-bottom: 16px; box-shadow: 4px 4px 0 #000; }

        ${['#ff6b6b','#feca57','#1dd1a1','#4361ee'].map(c=>`<div class="clay-dot" style="background:${c};box-shadow:0 2px 6px ${c}66;"></div>`).join('')}
      </div>
    </div>
    <div class="clay-pill-row">
      ${[['#fce4ec','#c2185b','Home'],['#e8f5e9','#2e7d32','Pages'],['#e3f2fd','#1565c0','Help'],['#f3e5f5','#7b1fa2','More']].map(([bg,c,l])=>`<button class="clay-pill" style="background:${bg};color:${c};">${l}</button>`).join('')}
    </div>
    <div class="clay-main">
      <div style="display:flex;justify-content:center;gap:-8px;margin-bottom:20px;">
        ${[['#fce4ec','😢'],['#e8f5e9','🔍'],['#e3f2fd','🗺️']].map(([bg,e])=>`<div class="clay-emoji-wrap" style="background:${bg};">${e}</div>`).join('')}
      </div>
      <div class="clay-404" style="background:linear-gradient(135deg,#ec407a,#ab47bc,#7c4dff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">404</div>
      <div class="clay-title">Oops! Page not found</div>
      <div class="clay-sub">The page you're looking for seems to have wandered off. Don't worry, we'll help you find your way back!</div>
      <div class="clay-btn-row">
        <button class="clay-btn" style="background:#ec407a;color:#fff;">🏠 Go Home</button>
        <button class="clay-btn" style="background:#e8f5e9;color:#2e7d32;">← Go Back</button>
        <button class="clay-btn" style="background:#e3f2fd;color:#1565c0;">🔗 Share</button>
      </div>
      <div class="clay-search">
        <span style="font-size:16px;">🔍</span>
        <input placeholder="What were you looking for?" style="flex:1;border:none;outline:none;font-size:14px;font-family:inherit;color:#444;background:transparent;" />
      </div>
    </div>
    <div class="clay-card-row">
      ${[['🏠','#fce4ec','Home'],['📊','#e8f5e9','Stats'],['📁','#e3f2fd','Files'],['⚙️','#f3e5f5','Settings']].map(([icon,bg,label])=>`
        <div class="clay-card" style="background:${bg};">
          <div class="clay-card-emoji">${icon}</div>
          <div class="clay-card-label">${label}</div>
        </div>`).join('')}
    </div>
    <div style="text-align:center;margin-top:16px;font-size:11px;color:#aaa;">© 2026 AediaX Tech Pvt Ltd ✿</div>
  </div>`;
}

function liquidglass() {
  const bubbles = Array.from({length:6},(_,i)=>`<div class="liq-bubble" style="width:${80+i*40}px;height:${80+i*40}px;top:${[10,30,60,20,70,40][i]}%;left:${[5,70,20,85,45,60][i]}%;"></div>`).join('');
  return `<div class="liq-root">
    ${bubbles}
    <div class="liq-nav">
      <span class="liq-logo">◉ AediaX Tech</span>
      <div class="liq-nav-right">
        <button class="liq-pill active">Home</button>
        <button class="liq-pill">Work</button>
        <button class="liq-pill">Docs</button>
        <button class="liq-pill">Contact</button>
      </div>
    </div>
    <div class="liq-waves">
      ${[['12.4k','Visitors'],['99.9%','Uptime'],['2.3s','Load'],['7','Pages']].map(([n,l])=>`
        <div class="liq-wave-card"><div class="liq-wave-num">${n}</div><div class="liq-wave-label">${l}</div></div>`).join('')}
    </div>
    <div class="liq-main">
      <div class="liq-glow">
        <div class="liq-glow-ring"></div>
        <span>🌊</span>
      </div>
      <div class="liq-404">404</div>
      <div class="liq-title">Page Not Found</div>
      <div class="liq-sub">The page <strong style="color:rgba(255,255,255,0.9)">/reports/q4</strong> doesn't exist or has drifted away. Navigate back to safety.</div>
      <div class="liq-btn-row">
        <button class="liq-btn liq-btn-primary">🏠 Go Home</button>
        <button class="liq-btn liq-btn-ghost">← Go Back</button>
        <button class="liq-btn liq-btn-ghost">🔗 Share</button>
      </div>
      <div style="display:flex;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:30px;padding:11px 18px;gap:10px;align-items:center;max-width:380px;margin:0 auto;">
        <span style="color:rgba(255,255,255,0.5);">🔍</span>
        <input placeholder="Search for pages..." style="background:transparent;border:none;outline:none;color:#fff;font-size:14px;flex:1;font-family:inherit;" />
      </div>
    </div>
    <div class="liq-tiles">
      ${[['🏠','Home'],['📊','Analytics'],['📁','Projects'],['⚙️','Settings']].map(([icon,label])=>`
        <div class="liq-tile">
          <div class="liq-tile-icon">${icon}</div>
          <div class="liq-tile-label">${label}</div>
        </div>`).join('')}
    </div>
  </div>`;
}

function spatialui() {
  const stars = Array.from({length:30},(_,i)=>`<div class="spatial-star" style="top:${Math.random()*100}%;left:${Math.random()*100}%;opacity:${0.2+Math.random()*0.5};width:${1+Math.random()}px;height:${1+Math.random()}px;"></div>`).join('');
  return `<div class="spatial-root">
    ${stars}
    <div class="spatial-nav">
      <span class="spatial-logo">◈ AediaX Tech</span>
      <div class="spatial-nav-pills">
        <button class="spatial-nav-pill active">Overview</button>
        <button class="spatial-nav-pill">Projects</button>
        <button class="spatial-nav-pill">Analytics</button>
        <button class="spatial-nav-pill">Settings</button>
      </div>
      <div style="display:flex;gap:8px;">
        <div class="spatial-icon-btn">🔍</div>
        <div class="spatial-icon-btn">🔔</div>
        <div class="spatial-icon-btn">👤</div>
      </div>
    </div>
    <div class="spatial-stats">
      ${[['12.4k','Total Visitors'],['99.9%','Uptime'],['2.3s','Avg Load'],['404','Error Code']].map(([n,l])=>`
        <div class="spatial-stat"><div class="spatial-stat-num">${n}</div><div class="spatial-stat-label">${l}</div></div>`).join('')}
    </div>
    <div style="height:12px;"></div>
    <div class="spatial-main">
      <div class="spatial-halo">
        <div class="spatial-halo-ring" style="inset:-16px;opacity:0.3;"></div>
        <div class="spatial-halo-ring" style="inset:-28px;opacity:0.15;"></div>
        <div class="spatial-halo-ring" style="inset:-40px;opacity:0.08;"></div>
        <div class="spatial-icon-core">🛸</div>
      </div>
      <div class="spatial-404">404</div>
      <div class="spatial-title">Page not found</div>
      <div class="spatial-sub">The page <span style="color:rgba(108,92,231,0.8)">/reports/q4-analysis</span> could not be located in this space. It may have drifted beyond reach.</div>
      <div class="spatial-btn-row">
        <button class="spatial-btn spatial-btn-primary">⬡ Go Home</button>
        <button class="spatial-btn spatial-btn-ghost">← Go Back</button>
        <button class="spatial-btn spatial-btn-ghost">⬡ Share</button>
      </div>
      <div style="display:flex;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:11px 16px;gap:10px;align-items:center;max-width:360px;margin:0 auto;">
        <span style="color:rgba(255,255,255,0.3);font-size:14px;">⊛</span>
        <input placeholder="Search space..." style="background:transparent;border:none;outline:none;color:rgba(255,255,255,0.7);font-size:14px;flex:1;font-family:inherit;" />
      </div>
    </div>
    <div class="spatial-tiles">
      ${[['◬','Home','Return to base'],['⬡','Dashboard','Mission control'],['◈','Projects','Active missions'],['⊛','Settings','Configure']].map(([icon,label,sub])=>`
        <div class="spatial-tile">
          <div class="spatial-tile-icon" style="color:rgba(108,92,231,0.7);">${icon}</div>
          <div class="spatial-tile-label">${label}</div>
          <div class="spatial-tile-sub">${sub}</div>
        </div>`).join('')}
    </div>
  </div>`;
}

const renderers = { neomorphism: neo, glassmorphism: glass, minimalism, brutalism, maximalism, skeuomorphism, bentogrid, claymorphism, liquidglass, spatialui };

function renderCanvas() {
  document.getElementById('canvas').innerHTML = renderers[current]();
}

renderPicker();
renderCanvas();
</script>
</body>
